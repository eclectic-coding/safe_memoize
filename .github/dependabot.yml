version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      # Daily, to match the daily scheduled audit: a weekly cadence left new
      # advisories failing the audit for days before a fix PR appeared.
      interval: daily
    # Also bump transitive gems (rack, nokogiri, ...); advisories there fail the audit.
    allow:
    - dependency-type: all
    groups:
      bundler-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
