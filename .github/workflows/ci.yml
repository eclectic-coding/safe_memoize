name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run StandardRB
        run: bundle exec standardrb

  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    # Normal runs finish in under a minute; fail fast if the suite hangs
    # (default is 6 hours).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rake spec

      # SimpleCov marks :nocov: lines as "ignored"; Codecov rejects non-numeric
      # line values and discards the whole report, so treat them as non-lines.
      # Dependabot-triggered runs get no CODECOV_TOKEN (repo secrets are withheld
      # from them) and Codecov rejects tokenless uploads to a protected branch,
      # so the three Codecov steps are skipped for Dependabot PRs. The guard is
      # on the PR author so `@dependabot rebase` re-runs stay skipped.
      - name: Normalize ignored lines for Codecov
        if: matrix.ruby == '3.4' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: sed -i 's/"ignored"/null/g' coverage/coverage.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.ruby == '3.4' && github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.json

      # The upload step succeeds even when Codecov later fails to process the
      # report (state "error", 0% coverage), so poll the API and fail loudly.
      - name: Verify Codecov processed the report
        if: matrix.ruby == '3.4' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://api.codecov.io/api/v2/github/${owner}/repos/${repo}/commits/${SHA}/"
          for attempt in $(seq 1 18); do
            state=$(curl -fsS "$url" | jq -r '.state' || true)
            echo "Codecov state for ${SHA}: ${state:-unknown} (attempt ${attempt})"
            case "$state" in
              complete) exit 0 ;;
              error)
                echo "::error::Codecov failed to process the coverage report for ${SHA}"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::warning::Timed out waiting for Codecov to process ${SHA}"
